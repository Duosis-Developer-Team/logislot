# GHCR image build/push — branch'e gore tag'ler:
#   dev  -> :dev  + :dev-<sha7>     prod -> :prod + :prod-<sha7>
#
# NEXT_PUBLIC_API_URL BUILD-TIME'dir (Next.js bundle'ina gomulur):
# web image'i ortamin GERCEK API adresiyle build edilir —
# vars.DEV_NEXT_PUBLIC_API_URL / vars.PROD_NEXT_PUBLIC_API_URL
# (tanimli degilse NodePort varsayilanlari kullanilir).
#
# GHCR YAZMA YETKISI (deploy'un dusmesinin 1 numarali sebebiydi):
# GITHUB_TOKEN yalnizca pakete repo erisimi TANIMLIYSA yazabilir. logislot-api
# ve logislot-web org seviyesinde elle olusturulmustu, repoya bagli degildi ve
# her push "denied: permission_denied: write_package" ile dusuyordu.
# Kalici cozum iki parcali:
#   1) Dockerfile'lardaki org.opencontainers.image.source etiketi paketi repoya
#      BAGLAR ve her push'ta bagi tazeler.
#   2) Paket ayarlarinda repoya "Write" rolu verilir (bir kerelik):
#      https://github.com/orgs/Duosis-Developer-Team/packages/container/logislot-api/settings
#      https://github.com/orgs/Duosis-Developer-Team/packages/container/logislot-web/settings
# Alternatif: write:packages yetkili bir PAT'i GHCR_TOKEN secret'i olarak ekleyin;
# asagidaki login onu otomatik tercih eder, yoksa GITHUB_TOKEN'a duser.
name: Build Images

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Ayni branch'te iki build/deploy zinciri ayni anda kosmasin. cancel-in-progress
# KAPALI: deploy artik bu run'in parcasi, yarim kalan bir rollout'u iptal etmek
# cluster'i tutarsiz birakabilir — yeni push sirasini bekler.
concurrency:
  group: build-images-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      env_name: ${{ steps.env.outputs.env_name }}
      image_tag: ${{ steps.env.outputs.env_name }}-${{ steps.env.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Ortam belirle
        id: env
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" == "prod" ]]; then
            ENV_NAME=prod
            API_URL="${{ vars.PROD_NEXT_PUBLIC_API_URL }}"
            API_URL="${API_URL:-http://84.247.180.172:30083}"
          else
            ENV_NAME=dev
            API_URL="${{ vars.DEV_NEXT_PUBLIC_API_URL }}"
            API_URL="${API_URL:-http://84.247.180.172:30081}"
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          {
            echo "env_name=$ENV_NAME"
            echo "short_sha=$SHORT_SHA"
            echo "api_url=$API_URL"
          } >> "$GITHUB_OUTPUT"
          echo "Ortam: $ENV_NAME | sha: $SHORT_SHA | NEXT_PUBLIC_API_URL: $API_URL"

      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # GHCR kullanici adini onemsemez, tokeni dogrular: GHCR_TOKEN
          # tanimliysa o kullanilir (paket ACL'ine bagimli degildir), yoksa
          # GITHUB_TOKEN'a duser.
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: API image build/push
        run: |
          IMG=ghcr.io/duosis-developer-team/logislot-api
          docker build -t "$IMG:${{ steps.env.outputs.env_name }}" \
                       -t "$IMG:${{ steps.env.outputs.env_name }}-${{ steps.env.outputs.short_sha }}" \
                       apps/api
          docker push "$IMG:${{ steps.env.outputs.env_name }}"
          docker push "$IMG:${{ steps.env.outputs.env_name }}-${{ steps.env.outputs.short_sha }}"

      - name: Web image build/push (build-time NEXT_PUBLIC_API_URL ile)
        run: |
          IMG=ghcr.io/duosis-developer-team/logislot-web
          docker build -t "$IMG:${{ steps.env.outputs.env_name }}" \
                       -t "$IMG:${{ steps.env.outputs.env_name }}-${{ steps.env.outputs.short_sha }}" \
                       -f apps/web/Dockerfile \
                       --build-arg NEXT_PUBLIC_API_URL="${{ steps.env.outputs.api_url }}" \
                       .
          docker push "$IMG:${{ steps.env.outputs.env_name }}"
          docker push "$IMG:${{ steps.env.outputs.env_name }}-${{ steps.env.outputs.short_sha }}"

  # Deploy artik AYNI run'in devami. Boylece (1) prod deploy'u cagiran run'in
  # ref'i refs/heads/prod olur ve "production" environment branch policy'si
  # saglanir, (2) build dustugunde deploy sessizce "skipped" gecip kaybolmaz.
  deploy:
    needs: build-push
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ needs.build-push.outputs.env_name }}
      image_tag: ${{ needs.build-push.outputs.image_tag }}
    secrets: inherit
