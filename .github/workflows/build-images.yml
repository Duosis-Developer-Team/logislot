# GHCR image build/push — branch'e gore tag'ler:
#   dev  -> :dev  + :dev-<sha7>     prod -> :prod + :prod-<sha7>
#
# NEXT_PUBLIC_API_URL BUILD-TIME'dir (Next.js bundle'ina gomulur):
# web image'i ortamin GERCEK API adresiyle build edilir —
# vars.DEV_NEXT_PUBLIC_API_URL / vars.PROD_NEXT_PUBLIC_API_URL
# (tanimli degilse NodePort varsayilanlari kullanilir).
name: Build Images

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Ortam belirle
        id: env
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" == "prod" ]]; then
            ENV_NAME=prod
            API_URL="${{ vars.PROD_NEXT_PUBLIC_API_URL }}"
            API_URL="${API_URL:-http://84.247.180.172:30083}"
          else
            ENV_NAME=dev
            API_URL="${{ vars.DEV_NEXT_PUBLIC_API_URL }}"
            API_URL="${API_URL:-http://84.247.180.172:30081}"
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          {
            echo "env_name=$ENV_NAME"
            echo "short_sha=$SHORT_SHA"
            echo "api_url=$API_URL"
          } >> "$GITHUB_OUTPUT"
          echo "Ortam: $ENV_NAME | sha: $SHORT_SHA | NEXT_PUBLIC_API_URL: $API_URL"

      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image build/push
        run: |
          IMG=ghcr.io/duosis-developer-team/logislot-api
          docker build -t "$IMG:${{ steps.env.outputs.env_name }}" \
                       -t "$IMG:${{ steps.env.outputs.env_name }}-${{ steps.env.outputs.short_sha }}" \
                       apps/api
          docker push "$IMG:${{ steps.env.outputs.env_name }}"
          docker push "$IMG:${{ steps.env.outputs.env_name }}-${{ steps.env.outputs.short_sha }}"

      - name: Web image build/push (build-time NEXT_PUBLIC_API_URL ile)
        run: |
          IMG=ghcr.io/duosis-developer-team/logislot-web
          docker build -t "$IMG:${{ steps.env.outputs.env_name }}" \
                       -t "$IMG:${{ steps.env.outputs.env_name }}-${{ steps.env.outputs.short_sha }}" \
                       -f apps/web/Dockerfile \
                       --build-arg NEXT_PUBLIC_API_URL="${{ steps.env.outputs.api_url }}" \
                       .
          docker push "$IMG:${{ steps.env.outputs.env_name }}"
          docker push "$IMG:${{ steps.env.outputs.env_name }}-${{ steps.env.outputs.short_sha }}"
