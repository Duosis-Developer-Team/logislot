# LogiSlot CI — backend (ruff+pytest) ve frontend (tsc+lint+build) job'lari.
# E2E (compose + demo smoke + Playwright) ayri workflow'tadir: e2e.yml —
# birlestirilmedi cunku E2E daha yavas ve compose gerektirir; hizli geri
# bildirim icin bu iki job bagimsiz kosar (rapor karari).
# NOT: workflow yeniden indeksleme (Actions kayit) tetiklemesi.
name: ci

on:
  workflow_dispatch:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bagimliliklar
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      # Paralel feature branch'ler ayni revision'dan dallanip SIBLING migration
      # uretir; git merge cakisma vermez ama zincir ikiye boler. O durumda
      # k8s migration job'i ve konteyner acilisi (`alembic upgrade head`,
      # docker-entrypoint.sh `set -e`) patlar. Merge'den ONCE yakala.
      - name: Alembic tek head kontrolu
        run: |
          COUNT=$(alembic heads | grep -c '(head)')
          if [ "$COUNT" -ne 1 ]; then
            echo "HATA: $COUNT alembic head bulundu; migration zinciri dallanmis."
            echo "Cozum: kendi migration'inizin down_revision'ini digerinin id'sine cevirin."
            alembic heads
            exit 1
          fi
          echo "Tek head: $(alembic heads)"
      - name: Pytest (SQLite; PG gerektirmez)
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bagimliliklar
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
        working-directory: apps/web
      - name: Lint
        run: npm run lint:web
      - name: Build
        run: npm run build:web

  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Kustomize validation (dev + prod overlay render)
        run: |
          kubectl kustomize k8s/overlays/dev > /tmp/dev.yaml
          kubectl kustomize k8s/overlays/prod > /tmp/prod.yaml
          grep -q "namespace: logislot-dev" /tmp/dev.yaml
          grep -q "namespace: logislot-prod" /tmp/prod.yaml
          ! grep -q "namespace: hermes" /tmp/dev.yaml /tmp/prod.yaml
          echo "kustomize overlays OK"
