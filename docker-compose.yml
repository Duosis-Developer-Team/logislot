services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logislot
      POSTGRES_PASSWORD: logislot
      POSTGRES_DB: logislot
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logislot -d logislot"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      LOGISLOT_DATABASE_URL: postgresql+asyncpg://logislot:logislot@db:5432/logislot
      LOGISLOT_SECRET_KEY: dev-secret-change-me
      LOGISLOT_CORS_ORIGINS: '["http://localhost:3000","http://localhost:3010"]'
      # E2E paketi ayni demo hesabiyla arka arkaya ~15 kez giris yapar; varsayilan
      # limit (IP+email basina 60 sn'de 10) suite sonunda tesadufi 429 uretiyordu.
      # YALNIZCA dev/e2e compose'u icin gevsetildi — k8s prod overlay'i varsayilani
      # (10) kullanmaya devam eder, rate limit ACIK kalir.
      LOGISLOT_LOGIN_RATE_LIMIT_ATTEMPTS: "50"
      # Drake katalog anahtari; k8s'te overlay configmap'inden gelir.
      LOGISLOT_METRICS_ENVIRONMENT: "dev"
    ports:
      # Yerel makinelerde 8000/3000 sik dolu oldugu icin LogiSlot 8010/3010 kullanir.
      - "8010:8000"
      # /metrics — k8s'te BU PORT DISARIYA ACILMAZ (yalnizca pod ici).
      # Burada acik olmasi yerel dogrulamayi kolaylastirmak icindir.
      - "9464:9464"
    depends_on:
      db:
        condition: service_healthy

  # Maintenance scheduler: email retry (5 dk) + bildirim temizligi (24 sa).
  # Dev compose'ta ACIK (karar: pilot demo'da otomasyon gorunur olsun);
  # kapatmak icin: docker compose stop scheduler
  scheduler:
    build: ./apps/api
    # API imajinin entrypoint'i uvicorn baslatir; scheduler kendi komutunu kosar.
    entrypoint: ["python", "-m", "app.maintenance.scheduler"]
    environment:
      LOGISLOT_DATABASE_URL: postgresql+asyncpg://logislot:logislot@db:5432/logislot
      LOGISLOT_SECRET_KEY: dev-secret-change-me
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8010
    ports:
      - "3010:3000"
    depends_on:
      - api

volumes:
  db-data:
