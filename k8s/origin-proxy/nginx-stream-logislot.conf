# LogiSlot origin dinleyicisi — 8443 HEM TLS HEM DUZ HTTP kabul eder.
#
# NEDEN: Cloudflare origin'e hangi protokolle baglanacagini panel ayari
# ("SSL/TLS encryption mode") belirler. Flexible ise duz HTTP, Full ise TLS
# gonderir. Tek protokol dinleyen bir origin, panel ayari degistiginde
# sessizce kirilir — nitekim "Full" secili gorunurken bile duz HTTP geldi ve
# ingress "400 The plain HTTP request was sent to HTTPS port" dondu.
#
# ssl_preread baglantinin ILK baytlarina bakip TLS olup olmadigini anlar ve
# uygun ingress portuna yollar. Boylece origin panel ayarindan BAGIMSIZ
# calisir; Flexible'dan Full'e gecmek kesinti yaratmaz.
#
#   TLS  -> 30772  (ingress-nginx HTTPS NodePort)
#   duz  -> 31412  (ingress-nginx HTTP  NodePort)

map $ssl_preread_protocol $logislot_upstream {
    # Bos deger = TLS DEGIL (duz HTTP).
    ""      84.247.180.172:31412;
    default 84.247.180.172:30772;
}

server {
    listen 8443;
    ssl_preread on;
    proxy_pass $logislot_upstream;
    proxy_connect_timeout 5s;
    proxy_timeout 300s;
}
