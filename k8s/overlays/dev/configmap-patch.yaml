# DEV konfigurasyonu. NEXT_PUBLIC_API_URL BURADA DEGIL — build-time'dir ve
# CI'da web image build-arg'i olarak verilir (vars.DEV_NEXT_PUBLIC_API_URL,
# varsayilan: http://84.247.180.172:30081).
apiVersion: v1
kind: ConfigMap
metadata:
  name: logislot-config
data:
  LOGISLOT_ENVIRONMENT: "development"
  # Drake KATALOG ANAHTARI — namespace ("logislot-dev") DEGIL, yukaridaki
  # LOGISLOT_ENVIRONMENT ("development") de DEGIL. Sozlesme dev|prod ister
  # ve bu iki degerden birine benzeyen her sey metrikleri panolarda
  # gorunmez kilar. ci.yml -> manifests bu degeri dogrular.
  LOGISLOT_METRICS_ENVIRONMENT: "dev"
  LOGISLOT_ENABLE_DOCS: "true"
  # Public entry URL'i (backward-compat: eski tek-web adresi = yeni entry).
  LOGISLOT_PUBLIC_WEB_URL: "http://84.247.180.172:30080"
  # Portal izolasyonu (port-bazli, domain gelene kadar):
  #   30080 entry · 30084 supplier · 30085 admin · 30086 hidden platform
  # Platformun CORS'ta olmasi normaldir — gizlilik UI'dadir, guvenlik RBAC'te.
  LOGISLOT_CORS_ORIGINS: '["http://84.247.180.172:30080","http://84.247.180.172:30084","http://84.247.180.172:30085","http://84.247.180.172:30086","http://84.247.180.173:30080","http://84.247.180.173:30084","http://84.247.180.173:30085","http://84.247.180.173:30086","http://localhost:3010"]'
  # Hermes Ticket Hub baglantisi. Bu iki deger GIZLI DEGIL ve BURADA durmali:
  # `kubectl apply -k` configmap'i de uygular, yani repoda bos birakilirsa her
  # deploy canlidaki dolu degeri EZER ve ticket entegrasyonu sessizce kapanir.
  # (Tam olarak bu yasandi: degerler cluster'a elle girilmisti, dev'de bir
  # deploy base URL'i silmisti ve kimse fark etmemisti.)
  # Gizli olan iki deger secret'ta durur ve repoya GIRMEZ:
  #   LOGISLOT_HERMES_SUPPORT_TOKEN, LOGISLOT_HERMES_SUPPORT_WEBHOOK_SECRET
  # TUZAK: base_url `/v1` ile biter; sonuna `/support` EKLEMEYIN
  # (`/v1/support/support/...` 404 verir — dev'de tam olarak bu yasandi).
  # Dev, hermes-dev'e KUME ICINDEN gider: disari cikip geri donmez.
  LOGISLOT_HERMES_SUPPORT_BASE_URL: "http://core-service.hermes-dev.svc.cluster.local/api/integrations/v1"
  LOGISLOT_HERMES_SUPPORT_CLIENT_ID: "ba6d802a-662c-45d5-b919-d454b5fbf98a"
  LOGISLOT_HERMES_SUPPORT_CALLBACK_BASE_URL: "http://84.247.180.172:30081"
