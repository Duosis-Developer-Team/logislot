# Domain YOKKEN pratik dis erisim (herhangi bir makineden, /etc/hosts'suz):
#   web: http://84.247.180.172:30080   api: http://84.247.180.172:30081
# Mevcut NodePort'larla cakismaz (31412/30772/30880/30443 kullanimda).
apiVersion: v1
kind: Service
metadata:
  name: logislot-web-nodeport
  labels:
    app.kubernetes.io/name: logislot-web
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: logislot-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: logislot-api-nodeport
  labels:
    app.kubernetes.io/name: logislot-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: logislot-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30081
