# Portal izolasyonu (dev, port-bazli — domain gelene kadar).
#
# TEK web image'i 4 deployment'ta farkli LOGISLOT_PORTAL_MODE ile calisir
# (runtime env; NEXT_PUBLIC_* build-time oldugu icin bilerek kullanilmadi —
# bkz. docs/PORTAL_ISOLATION_AND_ROUTING.md). Mevcut `logislot-web`
# deployment'i dev patch'iyle ENTRY moduna alinir (30080); asagidaki uc
# deployment supplier/admin/platform portallaridir.
#
# 30086 (platform) HIDDEN'dir: public entry'den linklenmez, mobile'da yoktur.
# Gizlilik guvenlik degildir — gercek koruma backend RBAC'tedir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logislot-web-supplier
  labels:
    app.kubernetes.io/name: logislot-web-supplier
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: logislot-web-supplier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logislot-web-supplier
    spec:
      containers:
        - name: web
          image: ghcr.io/duosis-developer-team/logislot-web:dev
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: LOGISLOT_PORTAL_MODE
              value: "supplier"
            - name: LOGISLOT_ENTRY_URL
              value: "http://84.247.180.172:30080"
          resources:
            requests: { cpu: 50m, memory: 160Mi }
            limits: { cpu: 500m, memory: 512Mi }
          startupProbe:
            httpGet: { path: /login, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logislot-web-admin
  labels:
    app.kubernetes.io/name: logislot-web-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: logislot-web-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logislot-web-admin
    spec:
      containers:
        - name: web
          image: ghcr.io/duosis-developer-team/logislot-web:dev
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: LOGISLOT_PORTAL_MODE
              value: "admin"
            - name: LOGISLOT_ENTRY_URL
              value: "http://84.247.180.172:30080"
          resources:
            requests: { cpu: 50m, memory: 160Mi }
            limits: { cpu: 500m, memory: 512Mi }
          startupProbe:
            httpGet: { path: /login, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
---
# HIDDEN platform portali — public selector'da GORUNMEZ, linklenmez.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logislot-web-platform
  labels:
    app.kubernetes.io/name: logislot-web-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: logislot-web-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logislot-web-platform
    spec:
      containers:
        - name: web
          image: ghcr.io/duosis-developer-team/logislot-web:dev
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: LOGISLOT_PORTAL_MODE
              value: "platform"
          resources:
            requests: { cpu: 50m, memory: 160Mi }
            limits: { cpu: 500m, memory: 512Mi }
          startupProbe:
            httpGet: { path: /login, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: logislot-web-supplier-service
  labels:
    app.kubernetes.io/name: logislot-web-supplier
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: logislot-web-supplier
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30084
---
apiVersion: v1
kind: Service
metadata:
  name: logislot-web-admin-service
  labels:
    app.kubernetes.io/name: logislot-web-admin
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: logislot-web-admin
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30085
---
apiVersion: v1
kind: Service
metadata:
  name: logislot-web-platform-service
  labels:
    app.kubernetes.io/name: logislot-web-platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: logislot-web-platform
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30086
