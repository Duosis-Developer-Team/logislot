# Mevcut `logislot-web` (30082) PROD'da PUBLIC ENTRY moduna alinir:
# yalnizca portal secici + pazarlama sayfalarini servis eder.
# Platform portali entry'de GORUNMEZ (yalnizca Tedarikci + Yonetim).
#
# Probe'lar `/`ta: entry modda /login -> / yonlendirmesi vardir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logislot-web
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: LOGISLOT_PORTAL_MODE
              value: "entry"
            - name: LOGISLOT_ENTRY_URL
              value: "https://logislot.io"
            - name: LOGISLOT_SUPPLIER_URL
              value: "https://tedarikci.logislot.io/login"
            - name: LOGISLOT_ADMIN_URL
              value: "https://yonetim.logislot.io/login"
          startupProbe:
            httpGet: { path: /, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
