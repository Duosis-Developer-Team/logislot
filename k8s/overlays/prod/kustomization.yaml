# LogiSlot PROD ortami — namespace: logislot-prod.
# DEV'den TAMAMEN izole: ayri namespace, ayri PVC, ayri secret, ayri config.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: logislot-prod
resources:
  - namespace.yaml
  - ../../base
  - nodeport-services.yaml
  # Portal izolasyonu: tedarikci(30087)/yonetim(30088)/gizli admin(30089)
  # deployment+service'leri. Ayni web image'i farkli LOGISLOT_PORTAL_MODE ile.
  - web-portals.yaml
images:
  - name: ghcr.io/duosis-developer-team/logislot-api
    newTag: prod
  - name: ghcr.io/duosis-developer-team/logislot-web
    newTag: prod
patches:
  - path: configmap-patch.yaml
  - path: ingress-patch.yaml
  - path: resources-patch.yaml
  # Mevcut logislot-web (30082) -> public ENTRY modu.
  - path: web-entry-patch.yaml
