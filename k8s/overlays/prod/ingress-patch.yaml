# PROD host-bazli yonlendirme — MUSTERI URL'LERINDE PORT YOKTUR.
#
# NodePort'lar (30082/30083/30087/30088/30089) durmaya devam eder ama onlar
# dogrudan erisim/hata ayiklama icindir. Musteri trafigi 80/443'ten gelir ve
# Host basligina gore asagidaki Service'lere dagitilir.
#
# ONEMLI — ADLANDIRMA: `yonetim.*` PORTAL_MODE=admin'e, `admin.*` ise
# PORTAL_MODE=platform'a gider. Kod icindeki "admin" MUSTERININ yonetim
# paneli, "platform" bizim gizli admin panelimizdir.
#
# TENANT ALIAS'LARI: cknb/cknbtedarik ayri bir uygulama DEGILDIR; ayni
# yonetim/tedarikci portallerine giden marka alias'lardir. Tenant, giris
# yapan kullanicinin kimliginden cozulur — host'tan DEGIL. Yeni bir musteri
# alias'i eklemek = buraya iki satir + iki DNS kaydi.
#
# INGRESS CLASS — `nginx`. Kumede uc controller var; SECIM KRITERI class adi
# degil, controller'in HANGI NAMESPACE'LERI izledigidir:
#
#   controller           class        watch-namespace   Service (NodePort)
#   ingress-nginx        nginx        (yok = HEPSI)     80:31412  443:30772
#   ingress-nginx-test   nginx-test   hermes-test       80:30880  443:30443
#   drake-nginx          drake-nginx  -                 -
#
# `nginx-test` node1'de 80/443'u karsiliyor olsa da `--watch-namespace=
# hermes-test` ile SINIRLIDIR: `logislot-prod`daki bir Ingress'i HICBIR ZAMAN
# gormez. 27 Agu 2026'da "public port onda" diye class `nginx-test` yapildi,
# deploy edildi ve host'lar yine Hermes'in catch-all'ina dustu — sebep tam
# olarak buydu. Class TEKRAR `nginx` yapildi.
#
# KALAN ADIM: Ingress artik dogru controller'da, ama o controller'in
# NodePort'lari (31412/30772) host'un 80/443'une BAGLI DEGIL. Alan adlarinin
# PORTSUZ calismasi icin bir node'da 80->31412 / 443->30772 yonlendirmesi
# gerekir — Hermes'in `hermes-port-redirect.service` ile yaptiginin aynisi.
# Bkz. docs/PORTAL_ISOLATION_AND_ROUTING.md "Public giris yolu".
#
# HERMES ETKILENMEZ: farkli controller, farkli namespace, farkli NodePort.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logislot
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # HTTPS'e zorunlu yonlendirme. cert-manager sertifikayi uretene kadar
    # gecen kisa surede tarayici uyari gosterebilir; kalici durum HTTPS.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Ek dosya yuklemeleri icin (varsayilan 1m fazla dusuk kalirdi).
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - logislot.com
        - www.logislot.com
        - yonetim.logislot.com
        - tedarikci.logislot.com
        - admin.logislot.com
        - api.logislot.com
        - cknb.logislot.com
        - cknbtedarik.logislot.com
      secretName: logislot-tls-logislot-com
    - hosts:
        - logislot.io
        - www.logislot.io
        - yonetim.logislot.io
        - tedarikci.logislot.io
        - admin.logislot.io
        - api.logislot.io
        - cknb.logislot.io
        - cknbtedarik.logislot.io
      secretName: logislot-tls-logislot-io
  rules:
    # ---------- logislot.com ----------
    # Public web sitesi / portal secici (entry)
    - host: logislot.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: logislot-web, port: { name: http } }
    # Public web sitesi (www alias)
    - host: www.logislot.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: logislot-web, port: { name: http } }
    # YONETIM paneli (PORTAL_MODE=admin)
    - host: yonetim.logislot.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: logislot-web-admin-service, port: { name: http } }
    # TEDARIKCI portali (PORTAL_MODE=supplier)
    - host: tedarikci.logislot.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: logislot-web-supplier-service, port: { name: http } }
    # GIZLI admin paneli (PORTAL_MODE=platform)
    - host: admin.logislot.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: logislot-web-platform-service, port: { name: http } }
    # Backend API (tarayici DOGRUDAN cagirir)
    - host: api.logislot.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: logislot-api, port: { name: http } }
    # Cakes & Bakes'e ozel yonetim alias'i
    - host: cknb.logislot.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: logislot-web-admin-service, port: { name: http } }
    # Cakes & Bakes'e ozel tedarikci alias'i
    - host: cknbtedarik.logislot.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: logislot-web-supplier-service, port: { name: http } }
    # ---------- logislot.io ----------
    # Public web sitesi / portal secici (entry)
    - host: logislot.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: logislot-web, port: { name: http } }
    # Public web sitesi (www alias)
    - host: www.logislot.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: logislot-web, port: { name: http } }
    # YONETIM paneli (PORTAL_MODE=admin)
    - host: yonetim.logislot.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: logislot-web-admin-service, port: { name: http } }
    # TEDARIKCI portali (PORTAL_MODE=supplier)
    - host: tedarikci.logislot.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: logislot-web-supplier-service, port: { name: http } }
    # GIZLI admin paneli (PORTAL_MODE=platform)
    - host: admin.logislot.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: logislot-web-platform-service, port: { name: http } }
    # Backend API (tarayici DOGRUDAN cagirir)
    - host: api.logislot.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: logislot-api, port: { name: http } }
    # Cakes & Bakes'e ozel yonetim alias'i
    - host: cknb.logislot.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: logislot-web-admin-service, port: { name: http } }
    # Cakes & Bakes'e ozel tedarikci alias'i
    - host: cknbtedarik.logislot.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: logislot-web-supplier-service, port: { name: http } }
