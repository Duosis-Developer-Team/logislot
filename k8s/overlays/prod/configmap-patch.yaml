# PROD konfigurasyonu.
#
# NEXT_PUBLIC_API_URL BUILD-TIME'dir (Next.js bundle'ina gomulur) ve
# ConfigMap'ten DEGIL, CI'daki `vars.PROD_NEXT_PUBLIC_API_URL` degiskeninden
# gelir. 27 Agu 2026'da `https://api.logislot.com` yapildi.
#
# Bu yuzden prod gecisi IKI DEPLOY'dur ve SIRA onemlidir:
#   Asama 1 — ingress + portallar. Web imaji HALA IP:port API'sine bakar,
#             yani prod calismaya devam eder. DNS'ten ONCE onaylanabilir.
#   Asama 2 — yeni API adresiyle derlenmis web imaji. YALNIZCA DNS
#             cozulmeye basladiktan SONRA onaylanmalidir.
# Asama 2 erken onaylanirsa prod web cozulmeyen bir adrese istek atar ve
# tamamen kullanilamaz hale gelir. Ikisini tek deploy'da birlestirmek de
# ayni sonucu verirdi; bu yuzden bilerek ayrildilar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: logislot-config
data:
  LOGISLOT_ENVIRONMENT: "production"
  # Drake KATALOG ANAHTARI — namespace ("logislot-prod") DEGIL, yukaridaki
  # LOGISLOT_ENVIRONMENT ("production") de DEGIL. Drake'in uc sorgusu da
  # environment="prod" ile filtreler; burasi degisirse prod panolari sessizce
  # bosalir. ci.yml -> manifests bu degeri dogrular.
  LOGISLOT_METRICS_ENVIRONMENT: "prod"
  LOGISLOT_ENABLE_DOCS: "false"
  # E-posta sablonlarindaki portal linki. Domain yayina girdiginde musteri
  # e-postalarinda IP:port gormesin diye simdiden alan adi.
  LOGISLOT_PUBLIC_WEB_URL: "https://logislot.com"
  # CORS — GECIS LISTESI.
  #
  # Hem YENI alan adlari hem ESKI IP:port kokenleri birlikte duruyor.
  # Asama 1'de bundle hala IP:port API'sine gider (IP kokenleri sart);
  # Asama 2'den sonra da IP:port uzerinden acilan sayfa alan adindaki API'yi
  # cagirir, dolayisiyla IP kokeni yine gerekir. Bu satirlar ancak IP:port
  # erisimi tamamen birakildiginda SILINIR.
  LOGISLOT_CORS_ORIGINS: >-
    ["https://logislot.com","https://www.logislot.com",
    "https://yonetim.logislot.com","https://tedarikci.logislot.com",
    "https://admin.logislot.com","https://cknb.logislot.com",
    "https://cknbtedarik.logislot.com",
    "https://logislot.io","https://www.logislot.io",
    "https://yonetim.logislot.io","https://tedarikci.logislot.io",
    "https://admin.logislot.io","https://cknb.logislot.io",
    "https://cknbtedarik.logislot.io",
    "http://logislot.com","http://www.logislot.com",
    "http://yonetim.logislot.com","http://tedarikci.logislot.com",
    "http://admin.logislot.com","http://cknb.logislot.com",
    "http://cknbtedarik.logislot.com",
    "http://logislot.io","http://www.logislot.io",
    "http://yonetim.logislot.io","http://tedarikci.logislot.io",
    "http://admin.logislot.io","http://cknb.logislot.io",
    "http://cknbtedarik.logislot.io",
    "http://84.247.180.172:30082","http://84.247.180.173:30082",
    "http://84.247.180.172:30087","http://84.247.180.173:30087",
    "http://84.247.180.172:30088","http://84.247.180.173:30088",
    "http://84.247.180.172:30089","http://84.247.180.173:30089"]
  # Hermes ticket entegrasyonu: prod'da HENUZ BAGLI DEGIL.
  # Base URL bos oldugu surece talepler yerelde kaydedilir ve outbox'ta
  # bekler; hicbir kayit kaybolmaz (bkz. docs/HERMES_TICKETING_REPORT.md).
  # Baglanti icin gereken degerler karsi ekipten alinacak:
  #   LOGISLOT_HERMES_SUPPORT_BASE_URL  = https://hermes.duosis.com/api/integrations/v1
  #   LOGISLOT_HERMES_SUPPORT_CLIENT_ID = <Hermes integration client>
  #   + secret: TOKEN ve WEBHOOK_SECRET
  # TUZAK: base_url `/v1` ile biter; sonuna `/support` EKLEMEYIN
  # (`/v1/support/support/...` 404 verir — dev'de tam olarak bu yasandi).
  LOGISLOT_HERMES_SUPPORT_BASE_URL: ""
  # Hermes'in bu kuruluma olay gonderecegi adres (yalnizca dokumantasyon;
  # Hermes cagriyi kendi kayitli config'inden yapar).
  LOGISLOT_HERMES_SUPPORT_CALLBACK_BASE_URL: "https://api.logislot.com"
