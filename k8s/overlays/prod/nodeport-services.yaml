# PROD dis erisim (domain gelene kadar):
#   web: http://84.247.180.172:30082   api: http://84.247.180.172:30083
apiVersion: v1
kind: Service
metadata:
  name: logislot-web-nodeport
  labels:
    app.kubernetes.io/name: logislot-web
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: logislot-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30082
---
apiVersion: v1
kind: Service
metadata:
  name: logislot-api-nodeport
  labels:
    app.kubernetes.io/name: logislot-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: logislot-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30083
