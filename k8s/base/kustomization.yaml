# LogiSlot base kaynaklari.
# BILINCLI olarak dahil edilmeyenler:
# - secret.example.yaml (gercek secret kubectl ile olusturulur)
# - migration-job.yaml / seed-job.yaml (elle, sirayla kosulur)
# - networkpolicy.yaml (opsiyonel; CNI destegi dogrulanmadan uygulanmaz)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Namespace'ler overlay'lerde tanimlanir (logislot-dev / logislot-prod).
resources:
  - configmap.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - api-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - scheduler-deployment.yaml
  - ingress.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: logislot
    includeSelectors: false
