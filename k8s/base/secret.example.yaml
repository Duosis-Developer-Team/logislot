# ============================================================================
# ORNEK DOSYA — GERCEK DEGERLERLE DOLDURUP REPO'YA KOYMAYIN, APPLY ETMEYIN.
# Gercek secret'i kubectl ile olusturun (bkz. k8s/README.md "Secret Olusturma").
# kustomization.yaml bu dosyayi BILINCLI olarak icermez.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: logislot-secrets
  # namespace'i apply sirasinda -n ile verin (logislot-dev | logislot-prod)
type: Opaque
stringData:
  POSTGRES_USER: "logislot"
  POSTGRES_PASSWORD: "CHANGE_ME_strong_password"
  POSTGRES_DB: "logislot"
  # openssl rand -hex 32
  LOGISLOT_SECRET_KEY: "CHANGE_ME_openssl_rand_hex_32"
  # Cluster ici PostgreSQL (headless service uzerinden):
  LOGISLOT_DATABASE_URL: "postgresql+asyncpg://logislot:CHANGE_ME_strong_password@logislot-postgres:5432/logislot"
  # --- SMTP (opsiyonel; provider log_only iken kullanilmaz) ---
  LOGISLOT_SMTP_HOST: ""
  LOGISLOT_SMTP_PORT: "587"
  LOGISLOT_SMTP_USERNAME: ""
  LOGISLOT_SMTP_PASSWORD: ""
  LOGISLOT_SMTP_FROM_EMAIL: ""
  LOGISLOT_SMTP_FROM_NAME: "LogiSlot"
  # --- Hermes ticket entegrasyonu ---
  # Bu iki deger SECRET'tir ve ConfigMap'e/depoya KONMAZ.
  #   TOKEN          : Hermes'ten alinan backend-to-backend service token'i.
  #   WEBHOOK_SECRET : Hermes'in gonderdigi olaylarin HMAC-SHA256 imza siri.
  #                    BOS BIRAKILIRSA webhook ucu FAIL-CLOSED calisir ve TUM
  #                    istekleri 401 ile reddeder (bilincli tercih).
  # Rotasyonda kisa sure iki anahtar birden kabul edilebilir:
  #   LOGISLOT_HERMES_SUPPORT_WEBHOOK_SECRET_PREVIOUS
  LOGISLOT_HERMES_SUPPORT_TOKEN: ""
  LOGISLOT_HERMES_SUPPORT_WEBHOOK_SECRET: ""
  LOGISLOT_HERMES_SUPPORT_WEBHOOK_SECRET_PREVIOUS: ""
