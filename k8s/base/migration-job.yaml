# Sema migration'lari — deploy oncesi ELLE kosulur (kustomization'a dahil
# DEGILDIR; tamamlanmis Job yeniden apply edilemez):
#   kubectl -n logislot delete job logislot-migration --ignore-not-found
#   kubectl -n logislot apply -f k8s/base/migration-job.yaml
#   kubectl -n logislot logs -f job/logislot-migration
apiVersion: batch/v1
kind: Job
metadata:
  name: logislot-migration
  labels:
    app.kubernetes.io/name: logislot-migration
    app.kubernetes.io/part-of: logislot
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logislot-migration
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: ghcr.io/duosis-developer-team/logislot-api:dev
          # Iki zincir: once control-plane (ortak tablolar), sonra her
          # tenant semasi. Ikincisi 'ready' kaydi olmayan kurulumda no-op'tur.
          command:
            - sh
            - -c
            - |
              set -e
              alembic upgrade head
              python -m app.tenancy.migrations upgrade
          envFrom:
            - configMapRef: { name: logislot-config }
            - secretRef: { name: logislot-secrets }
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
