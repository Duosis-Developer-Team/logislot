# Non-secret konfigurasyon. IP/host'a bagli degerler overlays/pilot'ta
# patch'lenir; secret degerler logislot-secrets'ta yasar (asla burada degil).
apiVersion: v1
kind: ConfigMap
metadata:
  name: logislot-config
data:
  LOGISLOT_ENVIRONMENT: "production"
  # Drake katalog anahtari. Burada BILEREK gecersiz: her overlay kendi
  # degerini ("dev" / "prod") patch'lemek ZORUNDA. Boylece patch'i unutulan
  # bir ortam baska bir ortamin panolarina karismak yerine "unknown" olarak
  # gorunur. Bkz. docs/OBSERVABILITY_METRICS.md.
  LOGISLOT_METRICS_ENVIRONMENT: "unknown"
  LOGISLOT_ENABLE_DOCS: "false"
  LOGISLOT_RATE_LIMIT_ENABLED: "true"
  # Pilot ilk deploy: gercek SMTP yok -> log_only (e-postalar email_logs'a yazilir).
  # SMTP hazir olunca logislot-secrets'a SMTP_* ekleyip bu degeri "smtp" yapin.
  LOGISLOT_EMAIL_PROVIDER: "log_only"
  LOGISLOT_SCHEDULER_ENABLED: "true"
  LOGISLOT_EMAIL_RETRY_INTERVAL_SECONDS: "300"
  LOGISLOT_NOTIFICATION_CLEANUP_INTERVAL_SECONDS: "86400"
  LOGISLOT_NOTIFICATION_RETENTION_DAYS: "90"
  # Asagidaki iki deger overlay'de gercek erisim adresiyle degistirilir.
  LOGISLOT_PUBLIC_WEB_URL: "http://REPLACE_ME"
  LOGISLOT_CORS_ORIGINS: '["http://REPLACE_ME"]'
  # --- Hermes ticket entegrasyonu (secret OLMAYAN kisim) ---
  # Gercek adres overlay'de patch'lenir. BOS ise ticket ozelligi yerelde
  # calisir, Hermes'e gonderim denenmez ve platform sagligi bunu gosterir.
  LOGISLOT_HERMES_SUPPORT_BASE_URL: ""
  LOGISLOT_HERMES_SUPPORT_APPLICATION_CODE: "logislot"
  LOGISLOT_HERMES_SUPPORT_WEBHOOK_KEY_ID: "v1"
  LOGISLOT_HERMES_SUPPORT_TIMEOUT_SECONDS: "8"
  LOGISLOT_HERMES_SUPPORT_CATALOG_TTL_SECONDS: "300"
  LOGISLOT_TICKETING_ENABLED: "true"
  LOGISLOT_TICKET_OUTBOX_INTERVAL_SECONDS: "20"
  LOGISLOT_TICKET_RECONCILIATION_INTERVAL_SECONDS: "900"
  LOGISLOT_TICKET_INBOX_RECOVERY_INTERVAL_SECONDS: "300"
