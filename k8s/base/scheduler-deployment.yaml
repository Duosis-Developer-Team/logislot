# Maintenance scheduler (email retry 5 dk + bildirim temizligi 24 sa).
# Advisory lock cift kosuma karsi koruma saglar ama yine de replicas: 1
# ve Recreate stratejisi kullanilir (rollout sirasinda bile tek instance).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logislot-scheduler
  labels:
    app.kubernetes.io/name: logislot-scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: logislot-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logislot-scheduler
    spec:
      containers:
        - name: scheduler
          image: ghcr.io/duosis-developer-team/logislot-api:dev
          command: ["python", "-m", "app.maintenance.scheduler"]
          envFrom:
            - configMapRef: { name: logislot-config }
            - secretRef: { name: logislot-secrets }
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
